name: build

on:
  workflow_dispatch:
jobs:
  build_and_test:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build project with Maven
        env:
          MAVEN_OPTS: "-Djava.awt.headless=true\""
        run: mvn -T 4 --batch-mode " verify -P enableCheckStyle
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false
